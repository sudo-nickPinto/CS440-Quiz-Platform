name: quiz-platform

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-quiz_platform}
      DB_USERNAME: ${DB_USERNAME:-quiz_app}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-10}
      # The app's own emails (docs/EMAIL.md). "log" sends nothing.
      EMAIL_BACKEND: ${EMAIL_BACKEND:-log}
      EMAIL_FROM: ${EMAIL_FROM:-QuizBurg <no-reply@quizburg.local>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    expose:
      - "8000"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_AUTH0_DOMAIN: ${AUTH0_DOMAIN}
        VITE_AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
        VITE_AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    environment:
      # A hostname enables Caddy's automatic HTTPS. Use http://localhost for
      # local development where a publicly trusted certificate is unavailable.
      APP_SITE_ADDRESS: ${APP_SITE_ADDRESS:-http://localhost}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
      - "${APP_HTTPS_PORT:-8443}:443"
      - "${APP_HTTPS_PORT:-8443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
