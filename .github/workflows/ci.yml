name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (unit + MySQL integration)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: devpass
          MYSQL_DATABASE: quizdb_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pdevpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # Integration tests are skipped without this; the database name must contain "test".
      TEST_DATABASE_URL: mysql+pymysql://root:devpass@127.0.0.1:3306/quizdb_test?charset=utf8mb4
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations
        working-directory: .
        run: |
          for f in ulugbek-err/migrations/*.up.sql; do
            echo "Applying $f"
            mysql -h 127.0.0.1 -P 3306 -uroot -pdevpass quizdb_test < "$f"
          done

      - name: Run tests
        run: python -m pytest -q -rs

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
