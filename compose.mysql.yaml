# Optional overlay for hosting MySQL in the same Docker environment.
# Use a persistent named volume; initialization scripts run only when that
# volume is first created.
#
# Data is encrypted at rest (docs/DEPLOYMENT.md, "Database encryption at
# rest"): tables, redo/undo logs and binary logs are encrypted with a master
# key kept in the separate mysql-keyring volume. Back that volume up apart
# from the data; without it the data can't be read, even by you.
services:
  db:
    build: ./deploy/mysql
    image: quizburg-mysql:8.0-encrypted
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-quiz_platform}
      MYSQL_USER: ${DB_USERNAME:-quiz_app}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Encryption at rest. New tables are encrypted by default, and creating
      # an unencrypted one is refused.
      - --default-table-encryption=ON
      - --table-encryption-privilege-check=ON
      - --innodb-redo-log-encrypt=ON
      - --innodb-undo-log-encrypt=ON
      - --binlog-encryption=ON
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-keyring:/var/lib/mysql-keyring
      # Every ulugbek-err/migrations/*.up.sql file, in order. Add a line here
      # whenever a migration is added.
      - ./ulugbek-err/migrations/0001_accounts_and_groups.up.sql:/docker-entrypoint-initdb.d/0001.sql:ro
      - ./ulugbek-err/migrations/0002_quizzes.up.sql:/docker-entrypoint-initdb.d/0002.sql:ro
      - ./ulugbek-err/migrations/0003_live_sessions.up.sql:/docker-entrypoint-initdb.d/0003.sql:ro
      - ./ulugbek-err/migrations/0004_account_identity.up.sql:/docker-entrypoint-initdb.d/0004.sql:ro
      - ./ulugbek-err/migrations/0005_optional_session_group.up.sql:/docker-entrypoint-initdb.d/0005.sql:ro
      - ./ulugbek-err/migrations/0006_classes.up.sql:/docker-entrypoint-initdb.d/0006.sql:ro
      - ./ulugbek-err/migrations/0007_session_class.up.sql:/docker-entrypoint-initdb.d/0007.sql:ro
      - ./ulugbek-err/migrations/0008_quiz_class.up.sql:/docker-entrypoint-initdb.d/0008.sql:ro
      - ./ulugbek-err/migrations/0009_quiz_collaboration.up.sql:/docker-entrypoint-initdb.d/0009.sql:ro
      - ./ulugbek-err/migrations/0010_quiz_submission.up.sql:/docker-entrypoint-initdb.d/0010.sql:ro
      - ./ulugbek-err/migrations/0011_account_profile.up.sql:/docker-entrypoint-initdb.d/0011.sql:ro
      - ./ulugbek-err/migrations/0012_question_revision.up.sql:/docker-entrypoint-initdb.d/0012.sql:ro
      - ./ulugbek-err/migrations/0013_session_answer_correction.up.sql:/docker-entrypoint-initdb.d/0013.sql:ro
      - ./ulugbek-err/migrations/0014_faculty_access.up.sql:/docker-entrypoint-initdb.d/0014.sql:ro
      - ./ulugbek-err/migrations/0015_question_bank.up.sql:/docker-entrypoint-initdb.d/0015.sql:ro
      - ./ulugbek-err/migrations/0016_class_roster.up.sql:/docker-entrypoint-initdb.d/0016.sql:ro
      - ./ulugbek-err/migrations/0017_trash_and_semester.up.sql:/docker-entrypoint-initdb.d/0017.sql:ro
      - ./ulugbek-err/migrations/0018_roster_membership_source.up.sql:/docker-entrypoint-initdb.d/0018.sql:ro
      - ./ulugbek-err/migrations/0019_trash_expiry_and_semester_family.up.sql:/docker-entrypoint-initdb.d/0019.sql:ro
      - ./ulugbek-err/migrations/0020_quiz_submission_rejection_comment.up.sql:/docker-entrypoint-initdb.d/0020.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - app-network

  backend:
    environment:
      DATABASE_URL: ""
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data:
  # The encryption master key. Keep a copy somewhere other than this server.
  mysql-keyring:
