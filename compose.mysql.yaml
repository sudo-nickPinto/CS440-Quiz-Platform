# Optional overlay for hosting MySQL in the same Docker environment.
# Use a persistent named volume; initialization scripts run only when that
# volume is first created.
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-quiz_platform}
      MYSQL_USER: ${DB_USERNAME:-quiz_app}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./ulugbek-err/migrations/0001_accounts_and_groups.up.sql:/docker-entrypoint-initdb.d/0001.sql:ro
      - ./ulugbek-err/migrations/0002_quizzes.up.sql:/docker-entrypoint-initdb.d/0002.sql:ro
      - ./ulugbek-err/migrations/0003_live_sessions.up.sql:/docker-entrypoint-initdb.d/0003.sql:ro
      - ./ulugbek-err/migrations/0004_account_identity.up.sql:/docker-entrypoint-initdb.d/0004.sql:ro
      - ./ulugbek-err/migrations/0005_optional_session_group.up.sql:/docker-entrypoint-initdb.d/0005.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - app-network

  backend:
    environment:
      DATABASE_URL: ""
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data:
